name: KiterOS Nano Build & Combine

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Build Tools & esptool
        run: |
          pip install --upgrade platformio esptool
          pio pkg install --global --tool "platformio/tool-mklittlefs"

      - name: 4. Generate Embedded Web Assets & Arduino Sketch
        run: python3 tools/build/combine_project.py

      - name: 5. Run UZIP Security & Validation Tests
        run: python3 -m unittest uzip/tests/test_uzip.py

      - name: 6. Compile Firmware Binary
        run: pio run --project-dir firmware

      - name: 7. Build LittleFS Filesystem Binary
        run: |
          MKLITTLEFS=$(find ~/.platformio/packages -name mklittlefs -type f | head -n 1)
          chmod +x "$MKLITTLEFS"
          mkdir -p firmware/.pio/build/nodemcuv2
          "$MKLITTLEFS" -c staging_fs -p 256 -b 8192 -s 524288 firmware/.pio/build/nodemcuv2/littlefs.bin

      - name: 8. Merge Firmware and Filesystem into Single .bin File
        run: |
          VERSION=${GITHUB_REF_NAME:-v0.1.0}
          if [[ ! "$VERSION" =~ ^v ]]; then VERSION="v0.1.0"; fi
          mkdir -p dist

          python3 -m esptool --chip esp8266 merge_bin \
            -o "dist/KiterOS-Nano-${VERSION}-AllInOne.bin" \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x000000 firmware/.pio/build/nodemcuv2/firmware.bin \
            0x300000 firmware/.pio/build/nodemcuv2/littlefs.bin

          cp firmware/.pio/build/nodemcuv2/firmware.bin "dist/KiterOS-Nano-${VERSION}-firmware.bin"
          cp firmware/.pio/build/nodemcuv2/littlefs.bin "dist/KiterOS-Nano-${VERSION}-filesystem.bin"

      - name: 9. Package Arduino IDE Sketch & Generate Checksums
        run: |
          VERSION=${GITHUB_REF_NAME:-v0.1.0}
          if [[ ! "$VERSION" =~ ^v ]]; then VERSION="v0.1.0"; fi

          # Zip the Arduino IDE sketch directory containing KiterOS_Nano.ino and all assets
          cd dist/Arduino_IDE_Sketch
          zip -r -9 "../KiterOS-Nano-${VERSION}-Arduino-IDE-Sketch.zip" KiterOS_Nano/
          cd ../..

          python3 tools/size_check/check_size.py \
            "dist/KiterOS-Nano-${VERSION}-firmware.bin" \
            "dist/KiterOS-Nano-${VERSION}-filesystem.bin" \
            "dist/KiterOS-Nano-${VERSION}-size-report.txt"

          cd dist
          sha256sum KiterOS-Nano-${VERSION}-*.bin KiterOS-Nano-${VERSION}-*.zip > "KiterOS-Nano-${VERSION}-SHA256SUMS.txt"

      - name: 10. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiterOS-Nano-Release-Files
          path: |
            dist/*.bin
            dist/*.zip
            dist/*.txt

      - name: 11. Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/KiterOS-Nano-${{ github.ref_name }}-size-report.txt
          files: |
            dist/KiterOS-Nano-${{ github.ref_name }}-AllInOne.bin
            dist/KiterOS-Nano-${{ github.ref_name }}-firmware.bin
            dist/KiterOS-Nano-${{ github.ref_name }}-filesystem.bin
            dist/KiterOS-Nano-${{ github.ref_name }}-Arduino-IDE-Sketch.zip
            dist/KiterOS-Nano-${{ github.ref_name }}-SHA256SUMS.txt
            dist/KiterOS-Nano-${{ github.ref_name }}-size-report.txt
